name : Ci spring boot

on:
   push:
     branches:
        -main


jobs:
  build:
     runs on : ubuntu-latest
     steps:

         -name: Checkout code
          uses: actions/checkout@v4

         -name: Setup java
          uses: actions/setup -java@v4
          with:
             java-version: '17'
             distribution: 'temurin'
             cache: maven

        -name: Build application
         run: mvn clean package 


